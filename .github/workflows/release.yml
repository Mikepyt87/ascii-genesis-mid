name: Publish Mid release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version (X.Y.Z)'
        required: true
      publish:
        description: 'Publish after all checks and the firmware build pass'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mid-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node -e 'if(!/^\d{1,5}\.\d{1,5}\.\d{1,5}$/.test(process.env.VERSION))process.exit(1)'
          printf '%s' "$VERSION" > firmware/release-version.txt
      - run: node preview/check.mjs && node tools/generate-assets.mjs --check
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/policy-check.c -o /tmp/policy-check && /tmp/policy-check
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/wifi-check.c -o /tmp/wifi-check && /tmp/wifi-check
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/touch-check.c -o /tmp/touch-check && /tmp/touch-check
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/parade-check.c -lm -o /tmp/parade-check && /tmp/parade-check
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
          command: idf.py -DPROJECT_VER=$(cat release-version.txt) build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install esptool==5.6.0
      - name: Package USB image and matching source
        env:
          MID_IDF_VERSION: '6.1.0'
          VERSION: ${{ inputs.version }}
        run: |
          node tools/package.mjs firmware/build
          mkdir -p publish
          cp release/ascii-genesis-mid-usb.bin release/ascii-genesis-mid.bin publish/
          node tools/make-manifest.mjs "$VERSION" release/ascii-genesis-mid.bin publish/manifest.json
          cp release/build-info.json release/SHA256SUMS.txt publish/
          node tools/make-release-notes.mjs "$VERSION" publish/RELEASE-NOTES.md
          cd release
          zip -q -r "../publish/ASCII-Genesis-Mid-v$VERSION.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: mid-${{ inputs.version }}
          path: publish/
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mid-${{ inputs.version }}
          path: publish
      - run: |
          tag="mid-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Use a new version number: this release already exists.'
            exit 1
          fi
          gh release create "$tag" publish/* --target "$GITHUB_SHA" --title "ASCII Genesis Mid v$VERSION" --notes-file publish/RELEASE-NOTES.md --latest
          if ! gh release view mid-stable >/dev/null 2>&1; then
            gh release create mid-stable --target "$GITHUB_SHA" --title "Mid wireless update channel" --notes "Current firmware manifest for GUITION ESP32-4848S040. Mini and Pi use separate update channels." --latest=false
          fi
          gh release upload mid-stable publish/manifest.json --clobber
